# Fifteen checks: six run your program, seven read src/main.py, two read docs/summary.md.
# The six program checks read only the Simon log at the end of a run, or look at which
# lights came on, never the story lines. Log values forgive extra spaces, letter case, and a
# missing colon. In these checks Simon's sequence is chosen for you rather than at random, and
# a pretend player presses the button when the light they want comes on. Each program check
# stops after five seconds.

- description: "[SIMON] The Simon log names you, and Lights logs how many lights are in leds: TODO 1 saves the name, and TODO 8 prints SIMON LOG with it"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_simon.py::test_program_runs_and_log_names_you

- description: "[SEQUENCE] Simon picks each light with random.randint(0, len(leds) - 1), once per light, and logs the length: positions start at 0, and randint includes both ends"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_simon.py::test_randint_picks_a_position

- description: "[WATCH] Simon's sequence 3, 1, 2, 2 lights those lights in that order: loop over sequence and light leds\\[position]"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_simon.py::test_watch_plays_the_sequence_in_order

- description: "[TURN] Pressing on every right light logs Correct steps 4 and Result PERFECT: when the button reads 0, append the light that is on to answer"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_simon.py::test_a_perfect_answer_scores_every_step

- description: "[SCORE] One wrong press logs 3 correct steps and TRY AGAIN: compare answer\\[position] with sequence\\[position] at every position"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_simon.py::test_a_wrong_press_is_scored_by_position

- description: "[TURN] A player who lets their light pass once still answers it: after the last light, the light goes back to the first"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_simon.py::test_the_light_goes_round_again

- description: "[CODE] random.randint(...) is called: Simon picks each light at random"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_structure.py::test_randint_is_called

- description: "[CODE] .append(...) is called: sequence and answer both grow one item at a time"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_structure.py::test_append_is_called

- description: "[CODE] A while loop reads button.value(): the light moves along until the button reads 0"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_structure.py::test_a_while_loop_reads_the_button

- description: "[CODE] A for loop over a list: `for position in sequence:` plays Simon's sequence"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_structure.py::test_a_for_loop_over_a_list

- description: "[CODE] Two lists are compared by position, like answer\\[position] == sequence\\[position]"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_structure.py::test_two_lists_compared_by_position

- src/main.py:
  - description: "[CODE] No TODO markers remain: delete each TODO comment once its code is written, including Author"
    check: MatchFileFragment
    options:
      fragment: TODO
      count: 0
      exact: true
  - description: "[CODE] At least six comments: explain why randint ends at len(leds) - 1, or what ends the while loop"
    check: CountSingleLineComments
    options:
      language: Python
      count: 6
      exact: false

- docs/summary.md:
  - description: "[SUMMARY] No TODO markers remain in docs/summary.md: replace each one with your answer, then delete it"
    check: MatchFileFragment
    options:
      fragment: TODO
      count: 0
      exact: true
  - description: "[SUMMARY] At least 150 words in docs/summary.md: answer every question in full sentences"
    check: CountFileWords
    options:
      count: 150
      exact: false
